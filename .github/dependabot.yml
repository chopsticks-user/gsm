# Weekly update PRs for Go modules and GitHub Actions, one grouped PR per
# ecosystem. The Nix flake inputs (flake/flake.lock) aren't covered:
# Dependabot doesn't support Nix (see docs/development.md, CI).
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go-modules:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
