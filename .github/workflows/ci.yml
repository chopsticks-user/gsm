name: CI

on:
  push:
    branches: [main, 'release-*']
  pull_request:
  # Weekly, so a vulnerability published against unchanged code still shows up.
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR runs are cancelled; every commit on main is verified.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: verify (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      # The same command as locally: scripts syntax, gofmt, go vet for
      # Linux/Windows/macOS, and the race tests, end-to-end test included.
      - name: Verify
        run: nix develop -c scripts/verify.sh
      # The Nix package; fails on a stale vendorHash (fixed by vendorhash.yml on Dependabot PRs).
      - name: Nix package
        run: nix build --no-link .#default
      # Fails on known vulnerabilities in code gsm actually calls, tests
      # included, for every OS it ships for (per-OS files differ). Separate
      # from verify because it needs the network for the vulnerability database.
      - name: Vulnerabilities
        run: |
          for target in linux/amd64 windows/amd64 darwin/arm64; do
            echo "== $target"
            GOOS=${target%/*} GOARCH=${target#*/} nix develop -c govulncheck -test ./...
          done

  # The Nix flake doesn't run on Windows, so these use the Go toolchain from
  # go.mod directly. The race detector and the end-to-end test (unix only)
  # already run in the Linux job.
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Test
        run: go test ./...
