name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR runs are cancelled; every commit on main is verified.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: verify (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      # The same command as locally: scripts syntax, gofmt, go vet for
      # Linux/Windows/macOS, and the race tests, end-to-end test included.
      - name: Verify
        run: nix develop path:./flake -c scripts/verify.sh
