name: Smoke (Windows)

# The real-server smoke tests on Windows: the same scripts as on Linux, run
# with Git Bash against native Palworld and Enshrouded servers. They download
# 5 to 15 GB per game, so they run by hand before a release, not on every PR
# (and on PRs that change this workflow, the smoke scripts or the Windows
# process code).
on:
  workflow_dispatch:
  pull_request:
    paths: [.github/workflows/smoke-windows.yml, scripts/smoke-*.sh, internal/proc/*_windows.go]

permissions:
  contents: read

jobs:
  smoke:
    name: smoke (${{ matrix.game }}, Windows)
    strategy:
      fail-fast: false
      matrix:
        game: [palworld, enshrouded]
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Install steamcmd
        shell: pwsh
        run: |
          Invoke-WebRequest https://steamcdn-a.akamaihd.net/client/installer/steamcmd.zip -OutFile steamcmd.zip
          Expand-Archive steamcmd.zip "$env:RUNNER_TEMP\steamcmd"
          "$env:RUNNER_TEMP\steamcmd" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          # The first run updates steamcmd itself and exits non-zero.
          & "$env:RUNNER_TEMP\steamcmd\steamcmd.exe" +quit
          exit 0
      - name: Smoke test
        # The scripts make their throwaway home here; runner.temp is on the large data drive.
        env:
          XDG_CACHE_HOME: ${{ runner.temp }}/smoke
        run: scripts/smoke-${{ matrix.game }}.sh
