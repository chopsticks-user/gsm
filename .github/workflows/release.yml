name: Release

# Pushing a version tag (v1.2.3, or v1.2.3-rc.1 for a pre-release) verifies the
# tagged commit, builds every binary and publishes a GitHub release with the
# tag's CHANGELOG.md section as its notes. Other tags don't match.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - name: Verify
        run: nix develop path:./flake -c scripts/verify.sh
      - name: Build
        run: nix develop path:./flake -c scripts/release-build.sh "$GITHUB_REF_NAME"
      - name: Release notes
        run: scripts/release-notes.sh "$GITHUB_REF_NAME" > build/release-notes.md
      # Everything is built before anything is published. gh release create
      # fails if the tag already has a release, so a re-run never overwrites.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          [[ $GITHUB_REF_NAME == *-* ]] && prerelease=(--prerelease)
          gh release create "$GITHUB_REF_NAME" build/release/* \
            --title "gsm $GITHUB_REF_NAME" --notes-file build/release-notes.md --verify-tag "${prerelease[@]}"
