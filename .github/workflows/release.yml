name: Release

# Pushing a version tag (v1.2.3, or v1.2.3-rc.1 for a pre-release) verifies the
# tagged commit, builds every binary and publishes a GitHub release with the
# tag's CHANGELOG.md section as its notes. Other tags don't match.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Minor releases are tagged on main; a patch vX.Y.Z (Z > 0) may instead be
      # tagged on its own release-X.Y branch (docs/development.md, Versioning).
      # A patch that is only on its release branch is an older line, so it
      # mustn't become the "Latest" release.
      - name: Tag is on main or its release branch
        id: line
        run: |
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "latest=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [[ $GITHUB_REF_NAME =~ ^v([0-9]+)\.([0-9]+)\.[1-9][0-9]*(-.*)?$ ]]; then
            branch="origin/release-${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
            if git rev-parse -q --verify "$branch" >/dev/null && git merge-base --is-ancestor "$GITHUB_SHA" "$branch"; then
              echo "latest=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
          fi
          echo "::error::$GITHUB_REF_NAME is neither on main nor a patch on its release-X.Y branch"; exit 1
      - uses: cachix/install-nix-action@v31
      - name: Verify
        run: nix develop path:./flake -c scripts/verify.sh
      - name: Build
        run: nix develop path:./flake -c scripts/release-build.sh "$GITHUB_REF_NAME"
      - name: Release notes
        run: scripts/release-notes.sh "$GITHUB_REF_NAME" > build/release-notes.md
      # Everything is built before anything is published. gh release create
      # fails if the tag already has a release, so a re-run never overwrites.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          [[ $GITHUB_REF_NAME == *-* ]] && prerelease=(--prerelease)
          gh release create "$GITHUB_REF_NAME" build/release/* \
            --title "gsm $GITHUB_REF_NAME" --notes-file build/release-notes.md --verify-tag \
            --latest="${{ steps.line.outputs.latest }}" "${prerelease[@]}"
